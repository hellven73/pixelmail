name: PixelMail checks and Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      live_tests:
        description: Run live API tests (creates temporary accounts)
        required: false
        type: boolean
        default: false
      browser_tests:
        description: Run browser integration tests (creates temporary accounts)
        required: false
        type: boolean
        default: false
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pixelmail-pages
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run check
      - name: Live account and attachment checks
        if: inputs.live_tests == true || contains(github.event.head_commit.message, '[live-test]')
        run: node tests/live-smoke.mjs
      - name: Browser integration checks
        if: inputs.browser_tests == true || contains(github.event.head_commit.message, '[browser-test]')
        run: |
          npm install --no-save --package-lock=false playwright-core@1.56.1
          node tests/browser-smoke.mjs
  deploy:
    needs: check
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5

      - run: mkdir -p _site && cp index.html style.css app.js motion.js config.js .nojekyll _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - uses: actions/deploy-pages@v4
        id: deployment
